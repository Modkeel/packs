# Keel Shaders. Keel Performance plus Iris, so shader packs run on the same measured
# optimizers. Built for CurseForge: tools/build_pack.py curseforge shaders.

name = "Keel Shaders"
slug = "shaders"
version = "0.1.0"
summary = "Shaders on vanilla Minecraft: Iris on the optimizers the Modkeel lab measured, tested together, with a crash safety net."
changelog = "First release."
loader = "fabric"
# 26.2 only: on CurseForge, Iris for 1.21.1 that runs with Sodium 0.8 is a beta
# (1.8.14-beta.1); the newest release, 1.8.8, refuses Sodium 0.8 ("Incompatible mods found!").
minecraft = ["26.2"]

# CurseForge project page (tools/pack_kit.py): fields only the website takes
[listing]
categories = ["Vanilla+", "Small / Light"]  # the first is the main one
license = "MIT"
curseforge_id = 1746605  # www.curseforge.com/minecraft/modpacks/keel-shaders

[curseforge]
fabric-api = 306612
sodium = 394468          # rendering: terrain FPS +34% (26.2), +102% (1.21.1)
entityculling = 448233   # hidden mobs not drawn: +80% to +134% FPS behind a wall (tr7zw)
immediatelyfast = 686911 # immediate-mode rendering: 300 mobs +45% FPS (1.21.1)
moreculling = 630104     # more culling of blocks: terrain +13% FPS (1.21.1)
lithium = 360438         # game logic: 400 mobs tick time -52%, redstone -37%
ferritecore = 459857     # memory: heap after startup -6% (the Fabric project)
modernfix = 790626       # startup time and memory
dynamic-fps = 335493     # lower frame rate while the game is in the background
modmenu = 308702         # the settings screens of the mods above
cloth-config = 348521    # settings library MoreCulling needs (shedaniel)
modkeel-companion = 1718308  # world copies before mod changes, crash diagnosis
iris = 455508            # shader packs on Sodium; lab: 300 mobs +64% FPS (1.21.1) vs vanilla

# On by default: the build writes overrides/config/iris.properties with its file name.
# Complementary License 1.2: allowed in a modpack through the store's own system (never as an
# uploaded file), unmodified, visibly credited in the description; problems it causes are ours.
[shaderpack]
name = "complementary-reimagined"  # EminGT, complementary.dev
curseforge = 627557

[curseforge_skip]
modernfix = ["26.2"]

[modrinth]  # [curseforge] names whose Modrinth slug differs (the modrinth action)
ferritecore = "ferrite-core"
modkeel-companion = "modkeel"

# Gallery candidates (build_pack.py shots --mc 26.2, and --no-shader for the same shots without
# it): mode out = outside from above, water = under water beside it; time = hour in ticks
# (1000 morning, 6000 noon, 12500 sunset), real light without night vision.
[[shots]]
name = "village-noon"
structure = "minecraft:village_plains"
time = 6000
[[shots]]
name = "village-sunset"
structure = "minecraft:village_plains"
yaw = 270
time = 12500
[[shots]]
name = "taiga-morning"
structure = "minecraft:village_taiga"
time = 1000
[[shots]]
name = "outpost-dusk"
structure = "minecraft:pillager_outpost"
time = 12800

# Store gallery, first in the kit (tools/pack_kit.py); before-after.jpg is village-sunset with
# and without the shader pack, split down the middle.
[[gallery]]
file = "before-after.jpg"
title = "Without shaders and with Keel Shaders"
description = "The same village at sunset: vanilla on the left, Complementary Reimagined on the right."
[[gallery]]
file = "village-sunset.jpg"
title = "Sunset over a plains village"
description = "Warm light, long shadows and water that reflects the hills."
[[gallery]]
file = "outpost-dusk.jpg"
title = "A pillager outpost at dusk"
description = "Snowy taiga with the sun going down behind the hill."
[[gallery]]
file = "taiga-morning.jpg"
title = "Morning in a taiga village"
description = "Soft morning light and haze over the river."
[[gallery]]
file = "village-noon.jpg"
title = "A plains village at noon"
description = "Clear daylight, still vanilla in style."

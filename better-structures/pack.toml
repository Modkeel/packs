# Vanilla world, better structures: YUNG's overhauls on a Minecraft version they do not
# support yet, through verified community ports. Each port is swapped for the official
# build as soon as one exists for this version (tools/build_pack.py does it on every build).

name = "Keel: Better Structures"
slug = "better-structures"
version = "0.1.0"
summary = "Vanilla Minecraft with YUNG's structure overhauls, verified on a version they do not support yet."
modrinth_slug = "keel-better-structures"
categories = ["adventure", "lightweight"]
# Modrinth environment: structures generate on the server (the integrated one in singleplayer)
environment = "client_and_server"
changelog = "First release."
minecraft = "26.2"
loader = "fabric"

# Modrinth projects, latest release for this Minecraft version; required deps are added.
mods = [
    # base
    "fabric-api", "cloth-config", "modmenu", "modkeel",
    # performance
    "sodium", "lithium", "ferrite-core", "immediatelyfast", "entityculling", "dynamic-fps",
    # more structures, same vanilla feel
    "dungeons-and-taverns", "towns-and-towers",
    # quality of life
    "appleskin", "jade", "mouse-tweaks", "xaeros-minimap", "xaeros-world-map",
]
# Launchers show these with a switch, on by default, so players can leave them out.
optional = ["modkeel"]

# Structures that cannot be placed at the test spots for a known reason, not a bug.
[place_exceptions]
"nova_structures:bunker" = "dimension_padding bottom 126 below a start 13 under the surface: only fits where the surface is above y~75"

# Ports: `project` is the original Modrinth project (its official build wins once it
# exists); the jar comes from the fork's own release when it has one, else from our build.
[[ports]]
project = "yungs-api"
repo = "MentalCokuntus/YUNGs-API"
branch = "agent/minecraft-26.2-port"
build = "yungs-api-26.2/Fabric/build/libs/YungsApi-26.2-Fabric-6.1.0.jar"


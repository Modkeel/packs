# Keel Vanilla+. Keel Performance plus the client-side quality-of-life mods that Fabric
# modpacks carry most (the lab's modpack co-occurrence study): nothing that changes worlds or recipes, so
# it joins any vanilla server. Built for CurseForge: tools/build_pack.py curseforge
# vanilla-plus. Draft: built, tested and benchmarked before its first release.

name = "Keel Vanilla+"
slug = "vanilla-plus"
version = "0.1.0"
summary = "Vanilla Minecraft, faster and friendlier: measured optimizers plus the quality-of-life mods most packs carry, client-side only."
changelog = "First release."
loader = "fabric"
minecraft = ["1.21.1", "26.2"]

# CurseForge project page (tools/pack_kit.py): fields only the website takes
[listing]
categories = ["Vanilla+", "Small / Light"]  # the first is the main one
license = "MIT"

[curseforge]
fabric-api = 306612
sodium = 394468          # rendering: terrain FPS +34% (26.2), +102% (1.21.1)
entityculling = 448233   # hidden mobs not drawn: +80% to +134% FPS behind a wall (tr7zw)
immediatelyfast = 686911 # immediate-mode rendering: 300 mobs +45% FPS (1.21.1)
moreculling = 630104     # more culling of blocks: terrain +13% FPS (1.21.1)
lithium = 360438         # game logic: 400 mobs tick time -52%, redstone -37%
ferritecore = 459857     # memory: heap after startup -6% (the Fabric project)
modernfix = 790626       # startup time and memory
dynamic-fps = 335493     # lower frame rate while the game is in the background
modmenu = 308702         # the settings screens of the mods above
cloth-config = 348521    # settings library MoreCulling needs (shedaniel)
modkeel-companion = 1718308  # world copies before mod changes, crash diagnosis
appleskin = 248787       # hunger and saturation on the HUD (57% of Fabric packs)
mouse-tweaks = 60089     # inventory dragging and scrolling
jade = 324717            # what you look at, on the HUD
shulkerboxtooltip = 315811
betterf3 = 401648
zoomify = 574741
skin-layers-3d = 521480
chat-heads = 407206
no-chat-reports = 634062
yacl = 667299            # settings library Zoomify needs
fabric-language-kotlin = 308769  # Zoomify is written in Kotlin

# Left out: Xaero's Minimap and World Map. On 1.21.1 they took the pack's terrain frame rate
# from 524 to 304 FPS (-43%) and 300 mobs from 202 to 155 (lab client benchmark, 2026-10-15).

[curseforge_skip]
modernfix = ["26.2"]
